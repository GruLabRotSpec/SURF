[experiment]
sample_name = "4MS isotope"
sample_temp = 70.0
gas_name = "Argon"
gas_width = 600.0
backing_pressure = 20.0
chamber_pressure = "1.0e-6 torr"
mw_width = 2.5

[scan_parameters]
start_freq = 12000.0
end_freq = 13000.0
step_size = 0.5
scanning_speed = 0.003

[digitizer_settings]
resolution = 100
acq_window = 100
acq_delay = 50
apodization = "Hanning"

[timing_settings]
rep_rate = 15
valve_mw_delay = 1300
spdt_width = 2.5
